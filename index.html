<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Library — Seat Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C4A42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JS Library">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C4A42'/%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5' fill='%2379C9AE'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5' fill='%23E8AA5B'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5' fill='%23E8AA5B'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1.5' fill='%23AAB4C2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F7F3;
    --panel:#FFFFFF;
    --ink:#181D1B;
    --ink-soft:#5E6A63;
    --ink-faint:#8B968F;
    --line:#E2E5DE;
    --line-strong:#CBD1C7;
    --teal:#1C4A42;
    --teal-mid:#2E6659;
    --teal-soft:#EDF3F0;
    --free-bg:#E6F1EA;
    --free-line:#7FB89C;
    --free-ink:#1F5C42;
    --occ-bg:#FBEDD8;
    --occ-line:#DFA35C;
    --occ-ink:#8A5A17;
    --res-bg:#E4E7ED;
    --res-line:#AEB7C4;
    --res-ink:#454F5C;
    --danger:#9C4632;
    --danger-dark:#7C3627;
    --radius:10px;
    --shadow-1:0 1px 2px rgba(24,29,27,0.06);
    --shadow-2:0 8px 24px rgba(24,29,27,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Source Serif 4',serif;}
  #app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}

  /* Header */
  header.topbar{
    padding:18px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);
    position:sticky;top:0;z-index:10;
  }
  header.topbar .brand-row{display:flex;align-items:center;gap:10px;}
  header.topbar .logo-mark{flex-shrink:0;display:block;border-radius:7px;box-shadow:var(--shadow-1);}
  header.topbar .brand{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.1;}
  header.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  header.topbar .who{font-size:13px;text-align:right;}
  header.topbar .who .name{font-weight:600;}
  header.topbar .who button{
    background:none;border:none;color:var(--teal-mid);font-size:11.5px;
    cursor:pointer;padding:0;margin-top:4px;font-family:inherit;
  }
  header.topbar .who button:hover{color:var(--teal);}

  /* Screens */
  .screen{padding:22px 20px 60px;animation:fadeIn 0.25s ease;}
  .hide{display:none !important;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Landing */
  .landing{padding:56px 24px 40px;text-align:left;}
  .landing .eyebrow{font-family:'Source Serif 4',serif;font-size:14px;color:var(--teal-mid);margin-bottom:14px;}
  .landing h1{font-family:'Source Serif 4',serif;font-size:29px;font-weight:600;line-height:1.28;margin:0 0 10px;letter-spacing:-0.01em;}
  .landing p.lead{color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin:0 0 34px;max-width:36ch;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:7px;font-weight:500;}
  .field input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line-strong);border-radius:var(--radius);
    font-size:16px;font-family:inherit;background:var(--panel);color:var(--ink);transition:border-color .15s;
    -webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;
  }
  .field input:focus{outline:none;border-color:var(--teal-mid);box-shadow:0 0 0 3px var(--teal-soft);}
  .btn{
    display:inline-block;padding:13px 22px;border-radius:var(--radius);border:none;
    font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-align:center;
    transition:background .15s,transform .08s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:var(--shadow-1);}
  .btn-primary:hover{background:var(--teal-mid);}
  .btn-primary:disabled{background:#C3CAC5;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--teal-mid);color:var(--teal-mid);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:var(--danger-dark);}
  .btn-block{width:100%;}
  .link-row{margin-top:28px;font-size:13px;color:var(--ink-soft);}
  .link-row button{background:none;border:none;color:var(--teal-mid);cursor:pointer;font-size:13px;font-family:inherit;padding:0;}
  .link-row button:hover{color:var(--teal);}

  /* Legend */
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:var(--ink-soft);}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;}

  /* Banner */
  .my-seat-banner{
    background:linear-gradient(135deg,var(--teal) 0%,#153B34 100%);color:#fff;border-radius:12px;
    padding:15px 17px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;
    box-shadow:var(--shadow-1);
  }
  .my-seat-banner .info .t{font-size:11.5px;opacity:0.75;font-weight:500;}
  .my-seat-banner .info .n{font-family:'Source Serif 4',serif;font-size:17px;font-weight:600;margin-top:3px;}
  .my-seat-banner .info .s{font-size:12.5px;opacity:0.85;margin-top:3px;}
  .my-seat-banner button{
    background:#fff;color:var(--teal);border:none;border-radius:8px;padding:9px 15px;
    font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s;
  }
  .my-seat-banner button:hover{opacity:0.9;}

  .current-shift-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .current-shift-note b{color:var(--ink);font-weight:600;}

  /* Seat grid */
  .room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--shadow-1);}
  .room-row{display:grid;grid-template-columns:20px repeat(5,1fr);gap:7px;align-items:center;margin-bottom:7px;}
  .room-row:last-child{margin-bottom:0;}
  .room-row .row-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);text-align:center;}
  .room-divider{height:1px;background:var(--line);margin:12px 0;position:relative;}
  .seat{
    aspect-ratio:1/1;border-radius:7px;border:1.5px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;background:var(--paper);position:relative;transition:transform .08s,box-shadow .15s;
  }
  .seat:active{transform:scale(0.94);}
  .seat .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .seat .tag{font-size:8px;margin-top:1px;}
  .seat.free{background:var(--free-bg);border-color:var(--free-line);color:var(--free-ink);}
  .seat.free:hover{box-shadow:0 0 0 3px var(--free-bg),0 0 0 4px var(--free-line);}
  .seat.occupied{background:var(--occ-bg);border-color:var(--occ-line);color:var(--occ-ink);cursor:default;}
  .seat.reserved{background:var(--res-bg);border-color:var(--res-line);color:var(--res-ink);cursor:default;}
  .seat.mine{outline:2.5px solid var(--teal);outline-offset:1.5px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,26,24,0.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    animation:overlayIn .18s ease;
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--panel);width:100%;max-width:720px;border-radius:18px 18px 0 0;
    padding:10px 20px 28px;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-2);
    animation:modalUp .22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes modalUp{from{transform:translateY(24px);opacity:0.6;}to{transform:translateY(0);opacity:1;}}
  .modal .handle{width:36px;height:4px;background:var(--line-strong);border-radius:3px;margin:0 auto 16px;}
  .modal h3{font-family:'Source Serif 4',serif;margin:0 0 4px;font-size:18px;font-weight:600;}
  .modal p.hint{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .shift-opt{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .shift-opt.checked{border-color:var(--teal-mid);background:var(--teal-soft);}
  .shift-opt .l{font-size:14px;font-weight:600;display:flex;align-items:center;}
  .shift-opt .t{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .shift-opt .now-badge{font-size:10px;background:var(--teal);color:#fff;padding:2px 7px;border-radius:20px;margin-left:8px;font-family:'Public Sans',sans-serif;font-weight:600;}
  .shift-opt input{width:19px;height:19px;accent-color:var(--teal);}
  .modal .actions{display:flex;gap:10px;margin-top:18px;}
  .modal .actions .btn{flex:1;}
  .info-line{font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .info-line b{color:var(--ink);}

  /* Admin */
  .admin-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--line);padding:3px;border-radius:10px;}
  .admin-tabs button{
    flex:1;padding:9px;border-radius:8px;border:none;background:transparent;
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s;
  }
  .admin-tabs button.active{background:var(--panel);color:var(--teal);box-shadow:var(--shadow-1);}
  .stat-row{display:flex;gap:10px;margin-bottom:22px;}
  .stat-card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
  .stat-card .v{font-family:'Source Serif 4',serif;font-size:22px;font-weight:600;}
  .stat-card .l{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .res-row, .occ-row{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:var(--panel);
  }
  .res-row .seatno, .occ-row .seatno{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13.5px;width:36px;text-align:center;
    background:var(--paper);border-radius:6px;padding:6px 0;flex-shrink:0;color:var(--ink-soft);
  }
  .res-row input{flex:1;padding:9px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;}
  .res-row input:focus{outline:none;border-color:var(--teal-mid);}
  .res-row button, .occ-row button{
    background:var(--danger);color:#fff;border:none;border-radius:7px;padding:9px 11px;font-size:12px;
    cursor:pointer;flex-shrink:0;font-family:inherit;font-weight:600;transition:background .15s;
  }
  .res-row button:hover, .occ-row button:hover{background:var(--danger-dark);}
  .res-row button.save{background:var(--teal);}
  .res-row button.save:hover{background:var(--teal-mid);}
  .occ-row .details{flex:1;font-size:12.5px;}
  .occ-row .details .n{font-weight:600;font-size:13.5px;}
  .occ-row .details .s{color:var(--ink-soft);margin-top:1px;}
  .empty-note{color:var(--ink-soft);font-size:13px;padding:24px 0;text-align:center;}
  .search-box{width:100%;padding:11px 13px;border:1.5px solid var(--line-strong);border-radius:9px;font-family:inherit;font-size:16px;margin-bottom:14px;-webkit-appearance:none;appearance:none;touch-action:manipulation;}
  .search-box:focus{outline:none;border-color:var(--teal-mid);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;z-index:100;
    max-width:80%;text-align:center;box-shadow:var(--shadow-2);animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>

<script>
const TOTAL_SEATS = 60;
const ADMIN_PASSWORD = 'admin123';
const GRACE_MS = 5 * 60 * 1000;

const SHIFTS = [
  {id:1, label:'Shift 1', startH:6,  endH:10, startLabel:'6:00 AM', endLabel:'10:00 AM'},
  {id:2, label:'Shift 2', startH:10, endH:14, startLabel:'10:00 AM', endLabel:'2:00 PM'},
  {id:3, label:'Shift 3', startH:14, endH:18, startLabel:'2:00 PM', endLabel:'6:00 PM'},
  {id:4, label:'Shift 4', startH:18, endH:22, startLabel:'6:00 PM', endLabel:'10:00 PM'},
  {id:5, label:'Shift 5', startH:22, endH:30, startLabel:'10:00 PM', endLabel:'6:00 AM'} // endH 30 = 6am next day
];

let state = {
  screen: 'landing', // landing | student | adminLogin | admin
  studentName: null,
  reserved: {},      // { "3": "Rahul" }
  occupancy: {},      // { "12": {name, shifts:[1,3], checkIn: iso, expiry: ts} }
  modalSeat: null,
  adminTab: 'reserved', // reserved | live
  adminSearch: '',
  syncError: null
};

// ---------- time helpers ----------
function libraryDayStart(now){
  const d = new Date(now);
  if(d.getHours() < 6){ d.setDate(d.getDate()-1); }
  d.setHours(6,0,0,0);
  return d;
}
function shiftWindow(shiftId, now){
  const dayStart = libraryDayStart(now);
  const sh = SHIFTS.find(s=>s.id===shiftId);
  const start = new Date(dayStart.getTime() + (sh.startH-6)*3600*1000);
  const end = new Date(dayStart.getTime() + (sh.endH-6)*3600*1000);
  return {start, end};
}
function currentShiftId(now){
  for(const sh of SHIFTS){
    const {start,end} = shiftWindow(sh.id, now);
    if(now >= start && now < end) return sh.id;
  }
  return null;
}
function computeExpiry(shiftIds, now){
  let maxEnd = 0;
  shiftIds.forEach(id=>{
    const {end} = shiftWindow(id, now);
    if(end.getTime() > maxEnd) maxEnd = end.getTime();
  });
  return maxEnd + GRACE_MS;
}
function fmtTime(d){
  return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}
function fmtShiftIds(ids){
  return ids.slice().sort((a,b)=>a-b).map(id=>'S'+id).join(', ');
}

// ---------- firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyCnSv8_AxlYZMtpFAK_uPGfoBiKC9wSvjQ",
  authDomain: "js-library-seats.firebaseapp.com",
  projectId: "js-library-seats",
  storageBucket: "js-library-seats.firebasestorage.app",
  messagingSenderId: "174847441878",
  appId: "1:174847441878:web:93ac5aad9b7f7ea7824277",
  measurementId: "G-Y5RQK5WRL7"
};

let firebaseReady = false;
let db = null, reservedDocRef = null, occupancyDocRef = null, attendanceLogsRef = null;

if(typeof firebase !== 'undefined'){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    reservedDocRef = db.collection('seatTracker').doc('reserved');
    occupancyDocRef = db.collection('seatTracker').doc('occupancy');
    attendanceLogsRef = db.collection('attendanceLogs');
    firebaseReady = true;
  }catch(e){ console.error('Firebase init failed', e); }
}

function libraryDateString(d){
  const day = libraryDayStart(d);
  const y = day.getFullYear(), m = String(day.getMonth()+1).padStart(2,'0'), dd = String(day.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function isTypingRightNow(){
  const active = document.activeElement;
  return !!(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'));
}
function maybeRender(){
  if(state.modalSeat !== null) return;
  if(state.screen !== 'student' && state.screen !== 'admin') return; // don't disturb name/password entry
  if(isTypingRightNow()) return; // don't disturb a field being typed in
  render();
}

async function saveReserved(){
  if(!firebaseReady) return;
  await reservedDocRef.set({ data: state.reserved });
}
async function saveOccupancy(){
  if(!firebaseReady) return;
  await occupancyDocRef.set({ data: state.occupancy });
}

async function logAttendance(seatNum, occ, checkOutIso, autoFreed){
  if(!firebaseReady) return;
  try{
    await attendanceLogsRef.add({
      seat: Number(seatNum),
      name: occ.name,
      shifts: occ.shifts,
      checkIn: occ.checkIn,
      checkOut: checkOutIso,
      autoFreed: !!autoFreed,
      date: libraryDateString(new Date(occ.checkIn))
    });
  }catch(e){ console.error('attendance log failed', e); }
}

async function cleanupExpired(){
  const now = Date.now();
  let changed = false;
  const expiredEntries = [];
  Object.keys(state.occupancy).forEach(seat=>{
    if(state.occupancy[seat].expiry <= now){
      expiredEntries.push([seat, state.occupancy[seat]]);
      delete state.occupancy[seat];
      changed = true;
    }
  });
  if(changed){
    await saveOccupancy();
    for(const [seat, occ] of expiredEntries){
      await logAttendance(seat, occ, null, true);
    }
  }
}

function startRealtimeSync(){
  if(!firebaseReady){
    state.syncError = 'Firebase failed to load (script blocked or no internet).';
    render();
    return;
  }
  reservedDocRef.onSnapshot((doc)=>{
    state.reserved = (doc.exists && doc.data().data) ? doc.data().data : {};
    state.syncError = null;
    maybeRender();
  }, (err)=>{
    console.error('reserved sync error', err);
    state.syncError = 'Reserved-seats sync error: ' + (err.code || '') + ' ' + (err.message || err);
    render();
  });

  occupancyDocRef.onSnapshot((doc)=>{
    state.occupancy = (doc.exists && doc.data().data) ? doc.data().data : {};
    state.syncError = null;
    maybeRender();
  }, (err)=>{
    console.error('occupancy sync error', err);
    state.syncError = 'Occupancy sync error: ' + (err.code || '') + ' ' + (err.message || err);
    render();
  });
}

// ---------- toast ----------
function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

// ---------- render ----------
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(state.syncError){
    const banner = el(`
      <div style="background:#9C4632;color:#fff;padding:12px 16px;font-size:12.5px;line-height:1.5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div><b>Sync error:</b> ${escapeHtml(state.syncError)}</div>
        <button id="dismissErr" style="background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;flex-shrink:0;">Dismiss</button>
      </div>
    `);
    banner.querySelector('#dismissErr').addEventListener('click', ()=>{ state.syncError = null; render(); });
    app.appendChild(banner);
  }

  if(state.screen === 'landing') app.appendChild(renderLanding());
  else if(state.screen === 'student') app.appendChild(renderStudent());
  else if(state.screen === 'adminLogin') app.appendChild(renderAdminLogin());
  else if(state.screen === 'admin') app.appendChild(renderAdmin());

  if(state.modalSeat !== null){
    app.appendChild(renderModal());
  }
}

function renderLanding(){
  const wrap = el(`
    <div class="landing">
      <div class="eyebrow">JS Library</div>
      <h1>Find a free seat<br>without the guesswork.</h1>
      <p class="lead">Check the live seat map, sit down, and mark your spot — so everyone else knows what's actually free.</p>
      <div class="field">
        <label>Your name</label>
        <input type="text" id="nameInput" placeholder="e.g. Ananya Sharma" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      </div>
      <button class="btn btn-primary btn-block" id="continueBtn">Continue</button>
      <div class="link-row"><button id="adminLink">Library admin? Log in here</button></div>
    </div>
  `);
  const input = wrap.querySelector('#nameInput');
  const contBtn = wrap.querySelector('#continueBtn');
  const go = ()=>{
    const v = input.value.trim();
    if(!v){ showToast('Please enter your name'); return; }
    state.studentName = v;
    try{ localStorage.setItem('jsLibraryStudentName', v); }catch(e){}
    state.screen = 'student';
    render();
  };
  contBtn.addEventListener('click', go);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  wrap.querySelector('#adminLink').addEventListener('click', ()=>{
    state.screen = 'adminLogin';
    render();
  });
  return wrap;
}

function mySeat(){
  const seat = Object.keys(state.occupancy).find(s => state.occupancy[s].name === state.studentName);
  return seat || null;
}

function renderStudent(){
  const wrap = el(`<div></div>`);
  const now = new Date();
  const curShift = currentShiftId(now);

  const header = el(`
    <header class="topbar">
      <div class="brand-row">
        <svg class="logo-mark" width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#1C4A42"/>
          <rect x="7" y="7" width="7" height="7" rx="1.5" fill="#79C9AE"/>
          <rect x="18" y="7" width="7" height="7" rx="1.5" fill="#E8AA5B"/>
          <rect x="7" y="18" width="7" height="7" rx="1.5" fill="#E8AA5B"/>
          <rect x="18" y="18" width="7" height="7" rx="1.5" fill="#AAB4C2"/>
        </svg>
        <div>
          <div class="brand">JS Library</div>
          <div class="sub">Live seat map · 60 seats</div>
        </div>
      </div>
      <div class="who">
        <span class="name">${escapeHtml(state.studentName)}</span>
        <br><button id="switchBtn">Not you? Switch</button>
      </div>
    </header>
  `);
  header.querySelector('#switchBtn').addEventListener('click', ()=>{
    state.studentName = null;
    try{ localStorage.removeItem('jsLibraryStudentName'); }catch(e){}
    state.screen = 'landing';
    render();
  });
  wrap.appendChild(header);

  const screen = el(`<div class="screen"></div>`);

  const mine = mySeat();
  if(mine){
    const occ = state.occupancy[mine];
    const banner = el(`
      <div class="my-seat-banner">
        <div class="info">
          <div class="t">Your seat</div>
          <div class="n">Seat ${mine}</div>
          <div class="s">${fmtShiftIds(occ.shifts)} · in since ${fmtTime(new Date(occ.checkIn))}</div>
        </div>
        <button id="checkoutBtn">Check out</button>
      </div>
    `);
    banner.querySelector('#checkoutBtn').addEventListener('click', async ()=>{
      const checkOutIso = new Date().toISOString();
      delete state.occupancy[mine];
      await saveOccupancy();
      await logAttendance(mine, occ, checkOutIso, false);
      showToast('Checked out of seat ' + mine);
      render();
    });
    screen.appendChild(banner);
  }

  const note = el(`
    <div class="current-shift-note">
      ${curShift ? `Current: <b>Shift ${curShift}</b> (${SHIFTS.find(s=>s.id===curShift).startLabel} – ${SHIFTS.find(s=>s.id===curShift).endLabel})` : 'Between shifts right now.'}
    </div>
  `);
  screen.appendChild(note);

  const legend = el(`
    <div class="legend">
      <span><span class="dot" style="background:var(--free-line)"></span>Free</span>
      <span><span class="dot" style="background:var(--occ-line)"></span>Occupied</span>
      <span><span class="dot" style="background:var(--res-line)"></span>Reserved</span>
    </div>
  `);
  screen.appendChild(legend);

  const room = el(`<div class="room"></div>`);
  const seatsPerRow = 5;
  const totalRows = Math.ceil(TOTAL_SEATS / seatsPerRow);
  let seatCounter = 1;
  for(let r=0; r<totalRows; r++){
    if(r > 0 && r % 3 === 0){
      room.appendChild(el(`<div class="room-divider"></div>`));
    }
    const rowLabel = String.fromCharCode(65 + r); // A, B, C...
    const rowEl = el(`<div class="room-row"></div>`);
    rowEl.appendChild(el(`<div class="row-label">${rowLabel}</div>`));
    for(let c=0; c<seatsPerRow && seatCounter<=TOTAL_SEATS; c++){
      const i = seatCounter++;
      const seatNum = String(i);
      let cls = 'free', tag = 'Free';
      let occ = state.occupancy[seatNum];
      const isReserved = !!state.reserved[seatNum];
      if(isReserved){
        cls = 'reserved'; tag = 'Reserved';
      } else if(occ){
        cls = 'occupied';
        tag = fmtShiftIds(occ.shifts);
      }
      const isMine = occ && occ.name === state.studentName;
      const seatEl = el(`
        <div class="seat ${cls} ${isMine?'mine':''}" data-seat="${i}">
          <div class="num">${i}</div>
          <div class="tag">${tag}</div>
        </div>
      `);
      seatEl.addEventListener('click', ()=> onSeatClick(i));
      rowEl.appendChild(seatEl);
    }
    room.appendChild(rowEl);
  }
  screen.appendChild(room);
  wrap.appendChild(screen);
  return wrap;
}

function onSeatClick(seatNum){
  const seatKey = String(seatNum);
  if(state.reserved[seatKey]){
    showToast('Seat ' + seatNum + ' is a reserved seat.');
    return;
  }
  const occ = state.occupancy[seatKey];
  if(occ){
    if(occ.name === state.studentName){
      showToast('This is your seat — use "Check out" above when you leave.');
    } else {
      const endShift = SHIFTS.find(s=>s.id === Math.max(...occ.shifts));
      showToast('Occupied · ' + fmtShiftIds(occ.shifts) + ' · until ' + endShift.endLabel);
    }
    return;
  }
  if(mySeat()){
    showToast('You already have seat ' + mySeat() + '. Check out first.');
    return;
  }
  state.modalSeat = seatNum;
  state.modalShifts = new Set([]);
  render();
}

function renderModal(){
  const seatNum = state.modalSeat;
  const now = new Date();
  const curShift = currentShiftId(now);
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal">
      <div class="handle"></div>
      <h3>Check in — Seat ${seatNum}</h3>
      <p class="hint">Select the shift(s) you'll be sitting for.</p>
      <div id="optsWrap"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn" disabled>Check in</button>
      </div>
    </div>
  `);
  const optsWrap = modal.querySelector('#optsWrap');
  SHIFTS.forEach(sh=>{
    const opt = el(`
      <label class="shift-opt">
        <div>
          <div class="l">${sh.label} ${sh.id===curShift?'<span class="now-badge">now</span>':''}</div>
          <div class="t">${sh.startLabel} – ${sh.endLabel}</div>
        </div>
        <input type="checkbox" data-shift="${sh.id}">
      </label>
    `);
    const checkbox = opt.querySelector('input');
    checkbox.addEventListener('change', ()=>{
      if(checkbox.checked){ state.modalShifts.add(sh.id); opt.classList.add('checked'); }
      else { state.modalShifts.delete(sh.id); opt.classList.remove('checked'); }
      confirmBtn.disabled = state.modalShifts.size === 0;
    });
    optsWrap.appendChild(opt);
  });
  const confirmBtn = modal.querySelector('#confirmBtn');
  modal.querySelector('#cancelBtn').addEventListener('click', ()=>{
    state.modalSeat = null;
    render();
  });
  confirmBtn.addEventListener('click', async ()=>{
    const shiftIds = Array.from(state.modalShifts);
    const nowTs = new Date();
    state.occupancy[String(seatNum)] = {
      name: state.studentName,
      shifts: shiftIds,
      checkIn: nowTs.toISOString(),
      expiry: computeExpiry(shiftIds, nowTs)
    };
    await saveOccupancy();
    state.modalSeat = null;
    showToast('Checked in at seat ' + seatNum);
    render();
  });
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay){ state.modalSeat = null; render(); }
  });
  return overlay;
}

function renderAdminLogin(){
  const wrap = el(`
    <div class="landing">
      <h1>Admin login</h1>
      <p class="lead">Manage reserved seats and see who's checked in.</p>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password" enterkeyhint="done">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn">Log in</button>
      <div class="link-row"><button id="backLink">Back to seat map</button></div>
    </div>
  `);
  const pwInput = wrap.querySelector('#pwInput');
  const attempt = ()=>{
    if(pwInput.value === ADMIN_PASSWORD){
      try{ localStorage.setItem('jsLibraryAdminAuthed', 'true'); }catch(e){}
      state.screen = 'admin';
      render();
    } else {
      showToast('Incorrect password');
    }
  };
  wrap.querySelector('#loginBtn').addEventListener('click', attempt);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  wrap.querySelector('#backLink').addEventListener('click', ()=>{
    state.screen = state.studentName ? 'student' : 'landing';
    render();
  });
  return wrap;
}

function renderAdmin(){
  const wrap = el(`<div></div>`);
  const header = el(`
    <header class="topbar">
      <div class="brand-row">
        <svg class="logo-mark" width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#1C4A42"/>
          <rect x="7" y="7" width="7" height="7" rx="1.5" fill="#79C9AE"/>
          <rect x="18" y="7" width="7" height="7" rx="1.5" fill="#E8AA5B"/>
          <rect x="7" y="18" width="7" height="7" rx="1.5" fill="#E8AA5B"/>
          <rect x="18" y="18" width="7" height="7" rx="1.5" fill="#AAB4C2"/>
        </svg>
        <div>
          <div class="brand">Admin</div>
          <div class="sub">Reserved seats & live occupancy</div>
        </div>
      </div>
      <div class="who">
        <button id="exitAdmin">Exit admin</button>
        &nbsp;·&nbsp;
        <button id="logoutAdmin">Log out</button>
      </div>
    </header>
  `);
  header.querySelector('#exitAdmin').addEventListener('click', ()=>{
    state.screen = state.studentName ? 'student' : 'landing';
    render();
  });
  header.querySelector('#logoutAdmin').addEventListener('click', ()=>{
    try{ localStorage.removeItem('jsLibraryAdminAuthed'); }catch(e){}
    state.screen = state.studentName ? 'student' : 'landing';
    render();
  });
  wrap.appendChild(header);

  const screen = el(`<div class="screen"></div>`);

  const reservedCount = Object.keys(state.reserved).length;
  const occCount = Object.keys(state.occupancy).length;
  const freeCount = TOTAL_SEATS - reservedCount - occCount;
  const stats = el(`
    <div class="stat-row">
      <div class="stat-card"><div class="v">${freeCount}</div><div class="l">Free</div></div>
      <div class="stat-card"><div class="v">${occCount}</div><div class="l">Occupied</div></div>
      <div class="stat-card"><div class="v">${reservedCount}</div><div class="l">Reserved</div></div>
    </div>
  `);
  screen.appendChild(stats);

  const tabs = el(`
    <div class="admin-tabs">
      <button id="tabReserved" class="${state.adminTab==='reserved'?'active':''}">Reserved seats</button>
      <button id="tabLive" class="${state.adminTab==='live'?'active':''}">Live occupancy</button>
      <button id="tabHistory" class="${state.adminTab==='history'?'active':''}">History</button>
    </div>
  `);
  tabs.querySelector('#tabReserved').addEventListener('click', ()=>{ state.adminTab='reserved'; render(); });
  tabs.querySelector('#tabLive').addEventListener('click', ()=>{ state.adminTab='live'; render(); });
  tabs.querySelector('#tabHistory').addEventListener('click', ()=>{ state.adminTab='history'; render(); });
  screen.appendChild(tabs);

  if(state.adminTab === 'reserved'){
    const search = el(`<input class="search-box" id="seatSearch" placeholder="Jump to seat number..." inputmode="numeric">`);
    search.addEventListener('input', ()=>{ state.adminSearch = search.value.trim(); renderReservedList(); });
    screen.appendChild(search);
    const listWrap = el(`<div id="reservedList"></div>`);
    screen.appendChild(listWrap);
    wrap.appendChild(screen);
    // defer list render until attached
    setTimeout(renderReservedList, 0);

    function renderReservedList(){
      listWrap.innerHTML = '';
      let seatNums = [];
      for(let i=1;i<=TOTAL_SEATS;i++) seatNums.push(i);
      if(state.adminSearch){
        seatNums = seatNums.filter(n => String(n).includes(state.adminSearch));
      }
      if(seatNums.length === 0){
        listWrap.appendChild(el(`<div class="empty-note">No matching seats.</div>`));
        return;
      }
      seatNums.forEach(n=>{
        const key = String(n);
        const currentName = state.reserved[key] || '';
        const row = el(`
          <div class="res-row">
            <div class="seatno">${n}</div>
            <input type="text" placeholder="Not reserved" value="${escapeHtml(currentName)}" data-seat="${n}">
            <button class="save">Save</button>
          </div>
        `);
        const input = row.querySelector('input');
        row.querySelector('.save').addEventListener('click', async ()=>{
          const v = input.value.trim();
          if(v){ state.reserved[key] = v; }
          else { delete state.reserved[key]; }
          await saveReserved();
          showToast('Seat ' + n + ' updated');
          render();
        });
        listWrap.appendChild(row);
      });
    }
    return wrap;
  }

  // live occupancy tab
  if(state.adminTab === 'live'){
    const liveWrap = el(`<div id="liveList"></div>`);
    screen.appendChild(liveWrap);
    wrap.appendChild(screen);

    const seats = Object.keys(state.occupancy).sort((a,b)=>Number(a)-Number(b));
    if(seats.length === 0){
      liveWrap.appendChild(el(`<div class="empty-note">No one is currently checked in.</div>`));
    } else {
      seats.forEach(seatKey=>{
        const occ = state.occupancy[seatKey];
        const row = el(`
          <div class="occ-row">
            <div class="seatno">${seatKey}</div>
            <div class="details">
              <div class="n">${escapeHtml(occ.name)}</div>
              <div class="s">${fmtShiftIds(occ.shifts)} · in ${fmtTime(new Date(occ.checkIn))} · auto-frees ${fmtTime(new Date(occ.expiry))}</div>
            </div>
            <button>End</button>
          </div>
        `);
        row.querySelector('button').addEventListener('click', async ()=>{
          const checkOutIso = new Date().toISOString();
          delete state.occupancy[seatKey];
          await saveOccupancy();
          await logAttendance(seatKey, occ, checkOutIso, false);
          showToast('Seat ' + seatKey + ' cleared');
          render();
        });
        liveWrap.appendChild(row);
      });
    }
    return wrap;
  }

  // history tab
  const todayStr = libraryDateString(new Date());
  const historyControls = el(`
    <div style="margin-bottom:14px;">
      <input type="date" id="historyDate" class="search-box" style="margin-bottom:0;" value="${todayStr}">
    </div>
  `);
  screen.appendChild(historyControls);
  const historyWrap = el(`<div id="historyList"><div class="empty-note">Loading...</div></div>`);
  screen.appendChild(historyWrap);
  wrap.appendChild(screen);

  async function loadHistory(dateStr){
    if(!firebaseReady){
      historyWrap.innerHTML = '';
      historyWrap.appendChild(el(`<div class="empty-note">Not connected to the database.</div>`));
      return;
    }
    historyWrap.innerHTML = '';
    historyWrap.appendChild(el(`<div class="empty-note">Loading...</div>`));
    try{
      const snap = await attendanceLogsRef.where('date', '==', dateStr).orderBy('checkIn', 'desc').limit(200).get();
      historyWrap.innerHTML = '';
      if(snap.empty){
        historyWrap.appendChild(el(`<div class="empty-note">No check-ins recorded for this day.</div>`));
        return;
      }
      snap.forEach(doc=>{
        const rec = doc.data();
        const inTime = fmtTime(new Date(rec.checkIn));
        const outTime = rec.checkOut ? fmtTime(new Date(rec.checkOut)) : (rec.autoFreed ? 'auto-freed' : 'still in');
        const row = el(`
          <div class="occ-row">
            <div class="seatno">${rec.seat}</div>
            <div class="details">
              <div class="n">${escapeHtml(rec.name)}</div>
              <div class="s">${fmtShiftIds(rec.shifts)} · ${inTime} \u2192 ${outTime}</div>
            </div>
          </div>
        `);
        historyWrap.appendChild(row);
      });
    }catch(e){
      console.error('history load failed', e);
      historyWrap.innerHTML = '';
      historyWrap.appendChild(el(`<div class="empty-note">Couldn't load history: ${escapeHtml(e.message || String(e))}</div>`));
    }
  }

  historyControls.querySelector('#historyDate').addEventListener('change', (e)=>{
    loadHistory(e.target.value);
  });
  loadHistory(todayStr);
  return wrap;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- init & sync ----------
function init(){
  try{
    const savedName = localStorage.getItem('jsLibraryStudentName');
    if(savedName){
      state.studentName = savedName;
      state.screen = 'student';
    }
    const adminAuthed = localStorage.getItem('jsLibraryAdminAuthed');
    if(adminAuthed === 'true'){
      state.screen = 'admin';
    }
  }catch(e){}
  render(); // show something immediately while the first snapshot loads
  startRealtimeSync();
  // Local check for auto-freeing expired seats (Firestore doesn't do this on its own)
  setInterval(()=>{
    if(isTypingRightNow()) return;
    cleanupExpired();
  }, 20000);
}
init();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
